[package]
name = "agent-monitor"
version = "0.1.0"
description = "A local, read-only monitor for Codex tasks"
authors = ["Agent Monitor"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agent_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-autostart = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6.1"
dirs = "5.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
thiserror = "1.0"
serialport = { version = "4.8", default-features = false }
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
tiny_http = "0.12"
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4.18.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
